<!doctype html>
<!--
  PRÉVIA APROXIMADA do login keycloak.v2 (PatternFly 5) com o tema adapters/keycloak/lc-hub.
  Markup reconstituído a partir da estrutura PF5/Keycloak (IDs kc-*); NÃO é o template real.
  Serve para revisão visual e de contraste; a validação definitiva exige Keycloak 26.x real.
  PatternFly carregado do CDN apenas nesta prévia (o Keycloak já embute o seu).
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia — login Keycloak (UDS / LC Hub)</title>
  <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@5.4.2/patternfly.min.css">
  <link rel="stylesheet" href="../adapters/keycloak/lc-hub/login/resources/css/uds.tokens.css">
  <link rel="stylesheet" href="../adapters/keycloak/lc-hub/login/resources/css/uds.profile.lc-hub.css">
  <link rel="stylesheet" href="../adapters/keycloak/lc-hub/login/resources/css/uds-login.css">
</head>
<body>
<div class="pf-v5-c-login">
  <div class="pf-v5-c-login__container">
    <header id="kc-header" class="pf-v5-c-login__header">
      <div id="kc-header-wrapper" class="pf-v5-c-brand">LC Hub</div>
    </header>
    <main class="pf-v5-c-login__main">
      <header class="pf-v5-c-login__main-header">
        <h1 class="pf-v5-c-title pf-m-3xl" id="kc-page-title">Entrar na sua conta</h1>
      </header>
      <div class="pf-v5-c-login__main-body">
        <div class="pf-v5-c-alert pf-m-danger pf-m-inline" role="alert">
          <p class="pf-v5-c-alert__title"><span class="pf-v5-screen-reader">Erro:</span> Usuário ou senha inválidos.</p>
        </div>
        <form id="kc-form-login" class="pf-v5-c-form" action="#" method="post" novalidate>
          <div class="pf-v5-c-form__group">
            <div class="pf-v5-c-form__group-label">
              <label class="pf-v5-c-form__label" for="username"><span class="pf-v5-c-form__label-text">Usuário ou e-mail</span></label>
            </div>
            <span class="pf-v5-c-form-control pf-m-error">
              <input id="username" name="username" type="text" value="levi" autocomplete="username" aria-invalid="true" aria-describedby="input-error-username">
            </span>
            <div class="pf-v5-c-form__helper-text" aria-live="polite">
              <div class="pf-v5-c-helper-text">
                <div class="pf-v5-c-helper-text__item pf-m-error" id="input-error-username">
                  <span class="pf-v5-c-helper-text__item-text">Usuário ou senha inválidos.</span>
                </div>
              </div>
            </div>
          </div>
          <div class="pf-v5-c-form__group">
            <div class="pf-v5-c-form__group-label">
              <label class="pf-v5-c-form__label" for="password"><span class="pf-v5-c-form__label-text">Senha</span></label>
            </div>
            <span class="pf-v5-c-form-control">
              <input id="password" name="password" type="password" autocomplete="current-password">
            </span>
          </div>
          <div class="pf-v5-c-form__group">
            <div class="pf-v5-c-check">
              <input class="pf-v5-c-check__input" type="checkbox" id="rememberMe" name="rememberMe">
              <label class="pf-v5-c-check__label" for="rememberMe">Lembrar de mim</label>
            </div>
          </div>
          <div id="kc-form-options"><a href="#">Esqueceu a senha?</a></div>
          <div class="pf-v5-c-form__group pf-m-action">
            <button class="pf-v5-c-button pf-m-primary pf-m-block" id="kc-login" type="submit">Entrar</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
</body>
</html>
