# Tema de login "lc-hub" — Universal Design System (perfil LC Hub).
# Alvo: Keycloak 26.x (tema padrão keycloak.v2 / PatternFly 5). Observado no acervo: Keycloak 26.7.2.
# Herda templates e scripts de keycloak.v2; só acrescenta CSS. Sem FreeMarker customizado nesta versão,
# o que mantém compatibilidade com upgrades do Keycloak.
parent=keycloak.v2

# `styles` substitui a lista do pai: css/styles.css continua vindo de keycloak.v2.
styles=css/styles.css css/uds.tokens.css css/uds.profile.lc-hub.css css/uds-login.css

# O perfil LC Hub V2 tem foco no tema claro (dark não é requisito da rodada corrente).
darkMode=false
