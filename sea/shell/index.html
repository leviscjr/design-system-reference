.chip-i { display: inline-flex; }

/* ---------- Explorer ---------- */

@container (max-width: 300px) { .mt { display: none; } .st { margin-left: auto; } }

.ex-rail, .in-rail { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; opacity: 0; pointer-events: none; transition: opacity .18s; }

.rail-sp { flex: 1; }

.ex-q:focus-within { border-color: var(--accent-line); background: var(--accent-soft); }

.ex-in::-webkit-search-cancel-button { display: none; }
.ex-clr { position: absolute; right: 2px; min-width: 24px; height: 24px; }

.ex-f { min-width: 24px; height: 24px; border-radius: 7px; }
.ex-f[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.ex-tree { flex: 1; min-height: 0; overflow: auto; position: relative; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.ex-tree-in { position: relative; padding: 2px 0 8px; }
.ex-list { position: relative; z-index: 1; }
.glide { --gl-o: .24; position: absolute; left: 6px; right: 6px; top: 0; height: 100%; filter: url(#sea-goo); opacity: var(--gl-o); pointer-events: none; transition: opacity .2s; }
.glide.hide { opacity: 0; }
.gl { position: absolute; left: 0; right: 0; top: 0; border-radius: 9px; background: var(--accent); will-change: transform; }
.gl.g2 { left: 3px; right: 3px; }

.row { display: flex; align-items: center; gap: 6px; min-height: var(--row-h); margin: 0 6px; padding: 3px 8px 3px calc(6px + var(--lv, 0) * 12px); border-radius: 9px; cursor: default; position: relative; color: var(--sa-text); }

.row:hover { background: var(--hover); }

.row.sel:hover { background: transparent; }
.row.ctx::after { content: ""; position: absolute; left: 2px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); opacity: .7; }
.tw { width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-3); flex: none; }
.tw svg { transition: transform .18s var(--ease); } .tw.open svg { transform: rotate(90deg); }
.ti { display: inline-flex; flex: none; }
.lb { font-size: 12.5px; line-height: 16px; min-width: 0; overflow-wrap: anywhere; } .lb mark { background: var(--accent-soft-2); color: inherit; border-radius: 3px; padding: 0 1px; }
.mt { color: var(--text-3); font-size: 11px; margin-left: auto; padding-left: 8px; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.mt:empty { display: none; }
.st { margin-left: 4px; display: inline-flex; flex: none; }
.mt:empty + .st { margin-left: auto; }
.ex-f-bar { display: flex; justify-content: flex-end; padding: 4px 12px 8px; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
.ex-empty { flex: 1; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--text-3); font-size: 12px; }

/* ---------- Canvas ---------- */
.cv { grid-column: 3; background: var(--canvas-bg); container-type: inline-size; }
.cv-h { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 6px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.cv-tabs { position: relative; display: flex; gap: 2px; flex: none; }

.cv-scope:empty { display: none; }

.cv-tools { display: flex; align-items: center; gap: 1px; flex: none; }
.tb-sep { flex: none; }
.cv-body { position: relative; flex: 1; min-height: 0; }
.cv-stage { position: absolute; inset: 0; }
.vw { position: absolute; inset: 0; }
.cv-stage.is-hidden { visibility: hidden; }
.cv-state { position: absolute; inset: 0; display: grid; place-items: center; }
.em { display: grid; justify-items: center; gap: 10px; color: var(--text-2); text-align: center; padding: 20px; }
.em p { margin: 0; font-size: 13px; } .em-i { color: var(--text-3); opacity: .8; display: inline-flex; }
.sk { width: min(420px, 70%); display: grid; gap: 10px; }
.sk i { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--hover), var(--press), var(--hover)); background-size: 220% 100%; animation: shimmer 1.3s linear infinite; }
.sk i:nth-child(2) { width: 82%; } .sk i:nth-child(3) { width: 64%; } .sk i:nth-child(4) { width: 90%; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
@container (max-width: 640px) { .cv-tab-t { display: none; } .cv-tab { padding: 0 9px; } .cv-scope-t { max-width: 12ch; } }
@container (max-width: 480px) { .cv-scope { display: none; } }

/* ---------- Actionbar ---------- */
.cv-float { position: absolute; inset: 0; z-index: 6; pointer-events: none; display: flex; justify-content: center; align-items: flex-end; padding: 0 12px 14px; }
.ab { position: relative; max-width: 100%; }
.ab-float { pointer-events: auto; transform: translateY(var(--ab-y, 0)); animation: abIn .3s var(--ease) both; filter: drop-shadow(0 8px 18px rgba(0, 10, 20, .28)); }
@keyframes abIn { from { opacity: 0; scale: .92; } }
.ab-bg { position: absolute; inset: 0; filter: url(#sea-goo); pointer-events: none; }
.ab-bg i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 12px; background: var(--bar-bg); transition: transform .32s var(--ease), width .32s var(--ease); }
.ab-float { color: var(--bar-fg); }

/* ContentHost — Universal Canvas. Não presume conteúdo: hospeda "viewers" registrados.
 *
 * Contrato de um viewer:
 *   { id, label, icon, interaction: 'scroll'|'pan-zoom'|'text',
 *     supports(ctx) -> true | { icon, title, action?:{label,run} }       // vazio útil
 *     create(host) -> instância {
 *        el, update(ctx) -> void|Promise, toolbar() -> item[], selectionRect() -> DOMRect|null,
 *        onShow?(ctx), destroy?() } }

      b.innerHTML = `${SEA.icon(v.icon, 15)}<span class="cv-tab-t">${esc(v.label)}</span>`;

    tabs.addEventListener('keydown', (e) => {

      else if (e.key === 'Home') j = 0; else if (e.key === 'End') j = viewers.length - 1;

    const scopeEl = h('div', { class: 'cv-scope' });
    const tools = h('div', { class: 'cv-tools', role: 'toolbar', 'aria-label': 'Ferramentas da visualização' });
    const btnMax = SEA.btn({ icon: 'maximize', label: 'Modo foco', kbd: 'F', pressed: false, on: () => o.layout.toggleFocus() });

      if (e.action) stateEl.querySelector('.em').appendChild(h('button', { type: 'button', class: 'btn', on: { click: e.action.run } }, e.action.label));

      get active() { return active; }, viewers,
      setViewer, refresh, paintScope,
      instance: (id) => inst.get(id || active),
      selectionRect() { const i = inst.get(active); return i && i.selectionRect && !stage.classList.contains('is-hidden') ? i.selectionRect() : null; },
      setFocusPressed(on) { SEA.setBtn(btnMax, { pressed: on, icon: on ? 'minimize' : 'maximize', label: on ? 'Sair do modo foco' : 'Modo foco' }); },
      /* localizar a origem de uma entidade (troca de viewer sem reconstruir o shell) */
      locate(id) { const e = store.get(id); if (!e) return; if (store.selection !== id) store.select(id, { source: 'canvas' }); const v = viewers.find((x) => x.locates && x.locates(ctxOf())); if (!v) return; if (active === v.id) { const i = inst.get(v.id); i && i.locate && i.locate(id); } else setViewer(v.id, true); },

    C({ id: 'ex', label: 'Alternar Explorer', icon: 'panel-left', kbd: 'Mod+B', group: 'Painéis', run: () => { L.toggleEx(); topbar.sync(); } });

    cfg.viewers.forEach((v, i) => C({ id: 'view-' + v.id, label: 'Visualizar: ' + v.label, icon: v.icon, kbd: 'Alt+' + (i + 1), group: 'Canvas', run: () => host.setViewer(v.id, true) }));
    document.addEventListener('keydown', (e) => {

    const app = { store, commands, layout: L, host, explorer, inspector, topbar, atmosphere, palette, setTheme, setAmbient, setDensity, fab, get theme() { return theme; } };
    (cfg.commands ? cfg.commands(app) : []).forEach(C);

    /* boot */
    atmosphere.mount(atmoEl); atmosphere.setTheme(theme); setAmbient(prefs.get('ambient')); topbar.setTheme(theme);
    L.apply(true);
    const restored = prefs.get('selection');
    store.select(store.has(restored) ? restored : cfg.initialSelection, { source: 'boot' });
    host.ready(); refreshBars(); topbar.sync();
    requestAnimationFrame(() => { explorer.reveal(store.selection, true); fab.layout(); });
    return app;
  };

/* ---- demo/viewers/pdf.js ---- */
/* Viewer: datasheet PDF (páginas renderizadas do documento real + caixas de evidência).

(function () {
  const SEA = (window.SEA = window.SEA || {});
  const { h, esc, clamp, Spring } = SEA.u;

  const evOf = (e) => (e && e.data && e.data.evidence) || null;

  function related(store, e) {
    if (e.kind === 'section') return store.children(e.id);
    if (e.kind === 'model') return F().entities.filter((x) => x.kind === 'parameter' && x.data.applies.includes(e.label)).map((x) => x.id);
    return [];
  }

  SEA.viewerPdf = {
    id: 'pdf', label: 'Datasheet', icon: 'file-text', interaction: 'scroll',
    locates: (ctx) => !!(ctx.entity && evOf(ctx.entity) && ctx.scope && F().documents[ctx.scope.docKey]),
    supports(ctx) {
      if (!ctx.scope) return { icon: 'file-text', title: 'Sem documento neste contexto', action: { label: 'Abrir datasheet', run: () => ctx.store.select(F().DOC, { source: 'canvas' }) } };
      if (!F().documents[ctx.scope.docKey]) return { icon: 'file-text', title: 'Sem páginas no fixture', action: { label: 'Abrir datasheet', run: () => ctx.store.select(F().DOC, { source: 'canvas' }) } };
      return true;
    },
    create(host) {
      const { store } = host, prefs = SEA.prefs;
      let FX = null, docKey = null, zoom = prefs.get('pdfZoom') || 1, showHl = true, built = false, curPage = 1, selId = null, lastCtx = null;
      const hlMap = new Map(), pageEls = new Map();
      const scroll = h('div', { class: 'pdf-scroll', tabindex: '0', role: 'document', 'aria-label': 'Páginas do datasheet' });
      const pagesEl = h('div', { class: 'pdf-pages' });
      scroll.appendChild(pagesEl);
      const el = h('div', { class: 'pdf' }, scroll);
      const pgLbl = h('span', { class: 'tb-lbl', 'aria-live': 'polite' }), zmLbl = h('span', { class: 'tb-lbl' });
      const sy = new Spring(0, { k: 190, c: 25, on: (v) => { scroll.scrollTop = v; } });
      const sx = new Spring(0, { k: 190, c: 25, on: (v) => { scroll.scrollLeft = v; } });
      ['wheel', 'pointerdown', 'touchstart'].forEach((ev) => scroll.addEventListener(ev, () => { sy.stop(); sx.stop(); }, { passive: true }));

      const fitW = () => Math.max(300, scroll.clientWidth - 40);
      function layout() { pagesEl.style.setProperty('--pw', Math.round(fitW() * zoom) + 'px'); zmLbl.textContent = Math.round(zoom * 100) + '%'; }
      function setZoom(z, anchorY) {
        z = clamp(z, 0.4, 3.2); if (Math.abs(z - zoom) < 0.001) return;
        const vy = anchorY != null ? anchorY : scroll.clientHeight / 2, ratio = (scroll.scrollTop + vy) / Math.max(1, scroll.scrollHeight);
        zoom = z; prefs.set('pdfZoom', z); layout();
        scroll.scrollTop = ratio * scroll.scrollHeight - vy; host.requestToolbar(); host.selectionChanged();
      }
      function fitPage() { const pg = FX.pages[0], ratio = pg.h / pg.w; setZoom((scroll.clientHeight - 40) / (fitW() * ratio)); }
      function gotoPage(n, smooth) {
        const p = pageEls.get(n); if (!p) return;
        const t = p.offsetTop - 14; smooth ? (sy.set(scroll.scrollTop), sy.to(t)) : (scroll.scrollTop = t);
      }
      function neighbor(dir) { const ns = FX.pages.map((p) => p.n), i = ns.indexOf(curPage); return ns[clamp(i + dir, 0, ns.length - 1)]; }

      function build() {
        built = true; let prev = null;
        FX.pages.forEach((pg) => {
          if (prev != null && pg.n - prev > 1) pagesEl.appendChild(h('div', { class: 'pdf-gap' }, pg.n - prev === 2 ? `p. ${prev + 1} fora do fixture` : `pp. ${prev + 1}–${pg.n - 1} fora do fixture`));
          const wrap = h('div', { class: 'pdf-page', 'data-page': pg.n, style: { aspectRatio: `${pg.w} / ${pg.h}` } });
          wrap.appendChild(h('img', { src: F().PAGES[docKey][pg.n], alt: `Datasheet ${FX.source.docId}, página ${pg.n}`, draggable: 'false' }));
          wrap.appendChild(h('span', { class: 'pdf-pn' }, 'p. ' + pg.n));
          F().entities.forEach((e) => {
            const ev = evOf(e); if (!ev || ev.page !== pg.n || e.docKey !== docKey) return;
            const [x0, y0, x1, y1] = ev.box;
            const b = h('button', { type: 'button', class: 'hl k-' + e.kind, 'data-id': e.id, style: { left: x0 * 100 + '%', top: y0 * 100 + '%', width: (x1 - x0) * 100 + '%', height: (y1 - y0) * 100 + '%' }, 'aria-label': e.label + (e.meta ? ', ' + e.meta : '') + ', página ' + pg.n, 'data-tip': e.label, 'data-tip-side': 'top' });
            b.addEventListener('click', () => host.select(e.id, { source: 'canvas', viewer: 'pdf', fromEl: b, morph: e.kind === 'parameter' ? 'value' : 'title' }));
            wrap.appendChild(b); hlMap.set(e.id, b);
          });
          pagesEl.appendChild(wrap); pageEls.set(pg.n, wrap); prev = pg.n;

      let tick = 0;
      scroll.addEventListener('scroll', () => {
        if (tick) return; tick = requestAnimationFrame(() => {
          tick = 0; const mid = scroll.scrollTop + scroll.clientHeight / 2; let best = curPage, bd = 1e9;
          pageEls.forEach((p, n) => { const d = Math.abs(p.offsetTop + p.offsetHeight / 2 - mid); if (d < bd) { bd = d; best = n; } });
          if (best !== curPage) { curPage = best; pgLbl.textContent = `p. ${curPage}`; host.requestToolbar(); }

      }, { passive: true });
      scroll.addEventListener('wheel', (e) => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientY - scroll.getBoundingClientRect().top); } }, { passive: false });

      }

        const e = ctx.entity; selId = e.id;
        const t = hlMap.get(e.id); if (t) t.classList.add('sel');
        related(ctx.store, e).forEach((id) => { const n = hlMap.get(id); n && n.classList.add('grp'); });

        el,
        update(ctx) {

            sy.stop(); sx.stop(); hlMap.clear(); pageEls.clear(); pagesEl.replaceChildren(); scroll.scrollTop = 0; scroll.scrollLeft = 0;
          }

            if (docKey !== ctx.scope.docKey) return;
            layout(); const target = mark(ctx);
            const src = (store.lastOpt || {});
            if (ctx.reason === 'select' && src.viewer !== 'pdf' && target) requestAnimationFrame(() => reveal(target, false));
            pgLbl.textContent = `p. ${curPage}`; host.selectionChanged();
          };
          if (!built) {
            build(); layout();
            return Promise.all([...el.querySelectorAll('img')].map((i) => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()))).then(() => { go(); const t = hlMap.get(ctx.entity.id); if (t) requestAnimationFrame(() => reveal(t, true)); });
          }
          go();
        },
        onShow(ctx) { layout(); const t = mark(ctx); if (t) requestAnimationFrame(() => reveal(t, true)); pgLbl.textContent = `p. ${curPage}`; host.selectionChanged(); },
        locate(id) { const n = hlMap.get(id); if (n) { reveal(n, true); n.classList.remove('ping'); void n.offsetWidth; n.classList.add('ping'); } },
        selectionRect() { const n = selId && hlMap.get(selId); if (!n) return null; const r = n.getBoundingClientRect(), s = scroll.getBoundingClientRect(); return r.bottom < s.top || r.top > s.bottom ? null : r; },
        toolbar() {
          const ns = FX.pages.map((p) => p.n);
          return [
            { id: 'prev', icon: 'chevron-up', label: 'Página anterior', group: 'nav', disabled: curPage === ns[0], run: () => gotoPage(neighbor(-1), true) },
            { id: 'pg', el: pgLbl, group: 'nav' },
            { id: 'next', icon: 'chevron-down', label: 'Próxima página', group: 'nav', disabled: curPage === ns[ns.length - 1], run: () => gotoPage(neighbor(1), true) },

/* ---- demo/inspect.js ---- */

  const list = (nodes) => h('div', { class: 'li-l' }, nodes);

  function crop(ev, id) {

    const [x0, y0, x1, y1] = ev.box;
    let c0 = Math.max(0, x0 - 0.08), c1 = Math.min(1, x1 + 0.08); if (c1 - c0 < 0.42) { const m = (x0 + x1) / 2; c0 = Math.max(0, Math.min(m - 0.21, 0.58)); c1 = c0 + 0.42; }

  function review(store, e) {

  function heroParam(p) {

    const cell = (l, v) => h('div', { class: 'mm' + (v ? '' : ' nil') }, h('span', null, l), h('b', null, v || '·'));

      sections.push({ id: 'p-src', title: 'Origem', body: h('div', { class: 'src' }, kv([['Documento', link(store, 'doc:'+e.docKey, { nostate: true })], ['Revisão', FXs.documents[e.docKey].source.revision], ['Página', String(p.evidence.page)], ['Trecho', p.evidence.excerpt, true]]), crop(p.evidence, e.id), h('p', { class: 'src-n' }, 'Valor copiado da tabela do PDF; posição obtida das coordenadas do texto.')) });
      sections.push({ id: 'p-rv', title: 'Revisão', body: review(store, e) });
      sections.push({ id: 'p-md', title: 'Metadados', open: false, body: kv([['ID', e.id, true], ['Tipo', 'parâmetro (observação extraída)'], ['Unidade', p.unit]]) });
    } else if (e.kind === 'model') {
      const ps = paramsOf(e.label);
      sections.push({ id: 'm-id', title: 'Identidade', body: kv([['Código', e.label], ['Família', link(store, e.parent, { nostate: true })], ['Fabricante', link(store, 'sup:fox', { nostate: true })], ['Documento', link(store, 'doc:'+e.docKey, { nostate: true })], ['Associação WEG', 'Não verificada']]) });
      const ev = evidenceList(); ev && sections.push(ev);
      sections.push({ id: 'm-ps', title: 'Parâmetros aplicáveis', count: ps.length, body: list(ps.slice(0, 12).map((x) => link(store, x.id, { meta: x.meta }))) });
      sections.push({ id: 'm-rv', title: 'Revisão', body: review(store, e) });

      sections.push({ id: 'f-id', title: 'Identidade', body: kv([['Fabricante', 'Fox ESS'], ['Associação WEG', 'Não verificada']]) });

      const ev = evidenceList(); ev && sections.push(ev);

    } else if (e.kind === 'document') {
      const s = e.src, ps = FXs.entities.filter((x) => x.kind === 'parameter' && x.docKey === e.docKey);

        hero = h('div', { class: 'hero' }, h('div', { class: 'hero-v', 'data-morph': 'value' }, h('span', { class: 'hero-n' }, String(ps.length)), h('span', { class: 'hero-u' }, 'parâmetros')),
          h('div', { class: 'cov', role: 'img', 'aria-label': Object.keys(by).map((k2) => `${by[k2]} ${store.states[k2].label}`).join(', ') }, Object.keys(by).map((k2) => h('i', { class: 'tone-' + store.states[k2].tone, style: { flex: by[k2] } })) ),
          h('div', { class: 'cov-l' }, Object.keys(by).map((k2) => h('span', { class: 'tone-' + store.states[k2].tone }, `${by[k2]} ${store.states[k2].label.toLowerCase()}`))));
